# ─── Nginx Route Configuration ────────────────────────────────

# ─── Rate Limiting Zones ───────────────────────────────────────────────
# 10 requests/second per IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 2 requests/second per IP for auth endpoints (brute-force protection)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
# 5 requests/second per IP for general pages
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5r/s;

# ─── Upstream: Next.js App ──────────────────────────────────────────────
upstream omnivote_backend {
    server app:3000;
    keepalive 32;
}

# ─── Upstream: WebSocket Server ────────────────────────────────────────
upstream omnivote_ws {
    server ws:3001;
    keepalive 32;
}

# ─── HTTP Server ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Security: maximum request body size (incident photos, evidence)
    client_max_body_size 50M;

    # Security: hide nginx version
    server_tokens off;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"               always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), payment=()" always;

    # ── WebSocket Proxy ──────────────────────────────────────────────────
    location /ws {
        proxy_pass http://omnivote_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (keep connections alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API Rate-Limited Routes: Auth ────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://omnivote_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Rate-Limited Routes: General ─────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://omnivote_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static Assets (Aggressive Caching) ────────────────────────────────
    location /_next/static/ {
        proxy_pass http://omnivote_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health Check (No logging, no rate limiting) ───────────────────────
    location /api/health {
        proxy_pass http://omnivote_backend;
        access_log off;
    }

    # ── Prometheus Metrics (Internal only) ────────────────────────────────
    location /api/metrics {
        # Restrict to internal network / Prometheus server
        # allow 172.28.0.0/16;
        # deny all;
        proxy_pass http://omnivote_backend;
        access_log off;
    }

    # ── General Pages ─────────────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://omnivote_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Deny Hidden Files ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Custom 429 Response ────────────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests. Please slow down.","retryAfter":60}';
    }
}