# ──────────────────────────────────────────────────────────────────────────────
# OmniVote – Docker Compose Production Stack
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f app    # follow app logs
#   docker compose down           # stop all services
#
# Required secrets (create a .env file or export before running):
#   JWT_SECRET=<your-jwt-secret>
#   OMNIVOTE_ENCRYPTION_KEY=<32-char-encryption-key>
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Next.js Application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivote-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/omnivote.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-a-64-char-random-string}
      - OMNIVOTE_ENCRYPTION_KEY=${OMNIVOTE_ENCRYPTION_KEY:-change-me-32-chars-minimum!!}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist SQLite database across container restarts
      - omnivote-db:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - omnivote-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────
  # Handles TLS termination, gzip, static asset caching, and security headers
  nginx:
    image: nginx:alpine
    container_name: omnivote-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - omnivote-net

  # ─── Redis (Future: rate limiting, session cache) ────────────────────────
  # Uncomment when the codebase migrates from in-memory to Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: omnivote-redis
  #   restart: unless-stopped
  #   command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - omnivote-redis:/data
  #   networks:
  #     - omnivote-net
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 15s
  #     timeout: 3s
  #     retries: 3

volumes:
  omnivote-db:
    driver: local
  nginx-certs:
    driver: local
  nginx-logs:
    driver: local
  # omnivote-redis:
  #   driver: local

networks:
  omnivote-net:
    driver: bridge