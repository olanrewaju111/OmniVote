# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Full-Stack Docker Compose (No Nginx)
#
# Next.js standalone handles all traffic directly.
# Rate limiting is handled at the application layer.
#
# Usage:
#   cp .env.example .env   # Edit with your secrets
#   docker compose up -d    # Start all services
#   docker compose logs -f  # Follow logs
#
# Profiles:
#   docker compose --profile monitoring up -d  # Include Prometheus + Grafana
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Next.js Application (directly exposed) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivote-app
    ports:
      - "${APP_PORT:-9323}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/omnivote.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - OMNIVOTE_ENCRYPTION_KEY=${OMNIVOTE_ENCRYPTION_KEY:-}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-OmniVote}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      - WS_PORT=${WS_PORT:-3001}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omnivote-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── WebSocket Server ───────────────────────────────────────────────
  ws:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: omnivote-ws
    ports:
      - "${WS_PORT:-9324}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/omnivote.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - WS_PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omnivote-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Redis 7 ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omnivote-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnivote-net
    restart: unless-stopped

  # ─── Prometheus (optional — use --profile monitoring) ────────────────
  prometheus:
    image: prom/prometheus:v3.3.0-alpine
    container_name: omnivote-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9325}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - omnivote-net
    restart: unless-stopped

  # ─── Grafana (optional — use --profile monitoring) ───────────────────
  grafana:
    image: grafana/grafana:11.5.2-alpine
    container_name: omnivote-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    networks:
      - omnivote-net
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  omnivote-net:
    driver: bridge
