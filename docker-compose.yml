# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Development & Base Docker Compose
# Task ID: 6 — Phase 14: Deployment & DevOps
#
# Usage:
#   cp .env.example .env   # Edit with your secrets
#   docker compose up -d    # Start all services
#   docker compose logs -f  # Follow logs
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Next.js Application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivote-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://omnivote:omnivote@postgres:5432/omnivote?schema=public}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-OmniVote}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnivote-net

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omnivote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnivote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnivote}
      POSTGRES_DB: ${POSTGRES_DB:-omnivote}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnivote} -d ${POSTGRES_DB:-omnivote}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omnivote-net

  # ─── WebSocket Server ───────────────────────────────────────────────────
  ws:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivote-ws
    entrypoint: ["dumb-init", "--"]
    command: ["npx", "tsx", "src/lib/ws-server.ts"]
    ports:
      - "${WS_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://omnivote:omnivote@postgres:5432/omnivote?schema=public}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WS_PORT=${WS_PORT:-3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnivote-net

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  postgres-data:
    driver: local

networks:
  omnivote-net:
    driver: bridge
