# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — E2E Tests (Playwright)
#
# Runs on push to main and PRs touching src/ or e2e/.
# Uses Playwright with a full app instance + test database.
# ──────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: file:/tmp/e2e-omnivote.db
  JWT_SECRET: e2e-test-secret-do-not-use-in-production-ever
  OMNIVOTE_ENCRYPTION_KEY: e2e-test-encryption-key-32chars!!
  NEXT_PUBLIC_WS_URL: ws://localhost:3001
  NEXT_PUBLIC_APP_NAME: OmniVote

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push test schema
        run: npx prisma db push --force-reset

      - name: Seed test data
        run: npx tsx scripts/seed.ts
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

      - name: Start app in background
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          cd .next/standalone && node server.js &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do sleep 1; done'
          echo "App is ready"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
