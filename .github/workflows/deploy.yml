# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Deployment Pipeline
# Task ID: 6 — Phase 14: Deployment & DevOps
#
# Triggers:
#   - Manual dispatch with environment selector (staging/production)
#   - Push to main branch
#
# Prerequisites (GitHub Settings → Secrets → Actions):
#   SSH_PRIVATE_KEY        — Private key for server access
#   DEPLOY_HOST            — Remote server IP/hostname
#   DEPLOY_USER            — SSH user on the remote server
#   DEPLOY_PATH            — App directory on remote server
#   DEPLOY_STAGING_HOST    — Staging server host (optional)
#   DEPLOY_STAGING_PATH    — Staging directory (optional)
#
# Rollback: To rollback, manually run this workflow with the previous
# commit SHA in the 'ref' input, or SSH to the server and run:
#   docker compose pull ghcr.io/owner/omnivote:<previous-sha>
#   docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Branch, tag, or SHA to deploy (for rollbacks)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/omnivote

jobs:
  # ─── Build & Push ────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.environment || 'production' }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy via SSH ──────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code (for compose & config files)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set deploy target vars
        id: target
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            echo "host=${{ secrets.DEPLOY_STAGING_HOST || secrets.DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "path=${{ secrets.DEPLOY_STAGING_PATH || '/opt/omnivote-staging' }}" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "path=${{ secrets.DEPLOY_PATH || '/opt/omnivote' }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.target.outputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }}:${{ steps.target.outputs.path }}/

      - name: Pull latest image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ steps.target.outputs.path }} && docker compose pull"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ steps.target.outputs.path }} && docker compose run --rm app npx prisma db push --skip-generate 2>/dev/null || true"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
            "cd ${{ steps.target.outputs.path }} && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans && \
             docker compose ps"

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 15
          HTTP_CODE=$(ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health --max-time 10" 2>/dev/null || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed!"
            ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
              "cd ${{ steps.target.outputs.path }} && docker compose logs --tail=50 app"
            exit 1
          fi
          echo "Deployment healthy!"

      - name: Cleanup old images
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ steps.target.outputs.host }} \
            "docker image prune -f --filter 'label=org.opencontainers.image.source=${{ github.repository }}'"