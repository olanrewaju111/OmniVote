# ──────────────────────────────────────────────────────────────────────────────
# OmniVote – Deploy to Remote Server via Docker + SSH
# ──────────────────────────────────────────────────────────────────────────────
#
# Triggers:
#   - Push to main branch
#   - Manual dispatch (for rollbacks or hotfixes)
#
# Prerequisites (GitHub repo Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY      — Private key for SSH access to the remote server
#   DEPLOY_HOST          — Remote server IP or hostname (e.g. 203.0.113.50)
#   DEPLOY_USER          — SSH user on the remote server (e.g. deploy)
#   DEPLOY_PATH          — App directory on the remote server (e.g. /opt/omnivote)
#   JWT_SECRET           — Strong random string for JWT signing
#   OMNIVOTE_ENCRYPTION_KEY — 32+ char encryption key
#
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/omnivote

jobs:
  # ─── Build & Push Docker Image ────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

  # ─── Deploy to Remote Server ─────────────────────────────────────────────
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build

    environment: production

    steps:
      - name: Checkout code (for docker-compose & nginx configs)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Strict host key checking for first connection
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure deploy directory exists
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}/{nginx,nginx/conf.d,data}"

      - name: Copy Docker Compose file
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml

      - name: Copy Nginx config
        run: |
          scp -i ~/.ssh/deploy_key \
            nginx/nginx.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/nginx/nginx.conf

      - name: Create production .env on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cat > ${{ secrets.DEPLOY_PATH }}/.env << 'ENVEOF'
          NODE_ENV=production
          DATABASE_URL=file:/app/data/omnivote.db
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          OMNIVOTE_ENCRYPTION_KEY=${{ secrets.OMNIVOTE_ENCRYPTION_KEY }}
          APP_PORT=3000
          NGINX_HTTP_PORT=80
          NGINX_HTTPS_PORT=443
          ENVEOF"

      - name: Log in to GHCR on remote server
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Pull latest image
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull"

      - name: Seed database (first run only)
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             docker compose run --rm app npx prisma db push --skip-generate 2>/dev/null || true"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             docker compose up -d --remove-orphans && \
             docker compose ps"

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 15
          HTTP_CODE=$(ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health --max-time 10" 2>/dev/null || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed!"
            ssh -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd ${{ secrets.DEPLOY_PATH }} && docker compose logs --tail=50 app"
            exit 1
          fi
          echo "✅ Deployment healthy!"

      - name: Cleanup old images
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker image prune -f --filter 'label=org.opencontainers.image.source=${{ github.repository }}'"