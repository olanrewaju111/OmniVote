# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Deploy to Server (Build on Server)
#
# Triggers on push to main after CI passes.
# Syncs code to server via rsync, builds Docker images on server,
# starts all services (including postgres, redis).
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.deploy_target || (github.ref == 'refs/heads/main' && 'production')) || 'staging' }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Sync source to server ────────────────────────────────────
      - name: Sync code to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='data' --exclude='*.log' --exclude='skills' --exclude='download' --exclude='agent-ctx'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH || '/opt/omnivote' }}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT || 22 }}

      # ── Step 2: Build images and start all containers ─────────────────────
      - name: Build and start containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          env: |
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            OMNIVOTE_ENCRYPTION_KEY: ${{ secrets.OMNIVOTE_ENCRYPTION_KEY }}
            DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/omnivote' }}
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # ── Ensure .env exists (first deploy) ───────────────────────────
            if [ ! -f .env ]; then
              echo "No .env found — creating from .env.example"
              cp .env.example .env
              echo "IMPORTANT: Edit .env on the server and set real secrets, then re-run deploy."
            fi

            # ── Start infrastructure (postgres, redis) ─────────────────────
            echo "=== Starting infrastructure ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d postgres redis

            # Wait for postgres to be ready
            echo "=== Waiting for PostgreSQL ==="
            timeout 60 bash -c '
              until docker compose exec -T postgres pg_isready -U omnivote -d omnivote > /dev/null 2>&1; do
                sleep 2
              done
            '
            echo "PostgreSQL is ready"

            # Wait for redis to be ready
            echo "=== Waiting for Redis ==="
            timeout 30 bash -c '
              until docker compose exec -T redis redis-cli ping > /dev/null 2>&1; do
                sleep 2
              done
            '
            echo "Redis is ready"

            # ── Build application images ────────────────────────────────────
            echo "=== Building app and ws images ==="
            docker compose build \
              --build-arg JWT_SECRET="${JWT_SECRET}" \
              --build-arg OMNIVOTE_ENCRYPTION_KEY="${OMNIVOTE_ENCRYPTION_KEY}" \
              app ws

            # ── Run DB migrations ──────────────────────────────────────────
            echo "=== Running database migrations ==="
            docker compose run --rm app npx prisma migrate deploy

            # ── Start all application services ─────────────────────────────
            echo "=== Starting all services ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d

            # ── Wait for app health check ──────────────────────────────────
            echo "=== Waiting for app health check ==="
            timeout 120 bash -c 'until wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q "ok\|up"; do sleep 2; done'
            echo "App is healthy!"

            # ── Cleanup ────────────────────────────────────────────────────
            echo "=== Cleaning up old images ==="
            docker image prune -f

            # ── Status ─────────────────────────────────────────────────────
            echo ""
            echo "=== Running containers ==="
            docker compose ps
            echo ""
            echo "=== Deploy complete ==="

      # ── Step 3: Smoke test ──────────────────────────────────────────────
      - name: Smoke test
        if: always()
        run: |
          DEPLOY_URL="${{ secrets.DEPLOY_URL || 'http://${{ secrets.DEPLOY_HOST }}:3000' }}"
          echo "Testing ${DEPLOY_URL}/api/health ..."
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "${DEPLOY_URL}/api/health" || echo "000")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "FAILED: health check returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "PASSED: health check HTTP ${HTTP_CODE}"

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          echo "Deploy ${STATUS^^}: ${SHA} to ${REF}"
