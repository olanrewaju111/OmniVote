# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Deploy to Server (Build on Server)
#
# Triggers on push to main after CI passes.
# git pull on server, then builds Docker images and starts all services.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.deploy_target || (github.ref == 'refs/heads/main' && 'production')) || 'staging' }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          env: |
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            OMNIVOTE_ENCRYPTION_KEY: ${{ secrets.OMNIVOTE_ENCRYPTION_KEY }}
            DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/omnivote' }}
            DEPLOY_BRANCH: ${{ github.ref_name }}
          script: |
            set -euo pipefail

            # ── Clone repo on first deploy, pull on subsequent ──────────────
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "=== First deploy: cloning repo ==="
              git clone -b "$DEPLOY_BRANCH" https://github.com/olanrewaju111/OmniVote.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              if [ ! -f .env ]; then
                echo "Creating .env from .env.example — edit secrets on the server!"
                cp .env.example .env
              fi
            else
              echo "=== Pulling latest code ==="
              cd "$DEPLOY_PATH"
              git fetch origin "$DEPLOY_BRANCH"
              git checkout "$DEPLOY_BRANCH"
              git pull origin "$DEPLOY_BRANCH"
            fi

            # ── Start infrastructure (postgres, redis) ─────────────────────
            echo "=== Starting infrastructure ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d postgres redis

            # Wait for postgres
            echo "=== Waiting for PostgreSQL ==="
            timeout 60 bash -c '
              until docker compose exec -T postgres pg_isready -U omnivote -d omnivote > /dev/null 2>&1; do
                sleep 2
              done
            '
            echo "PostgreSQL is ready"

            # Wait for redis
            echo "=== Waiting for Redis ==="
            timeout 30 bash -c '
              until docker compose exec -T redis redis-cli ping > /dev/null 2>&1; do
                sleep 2
              done
            '
            echo "Redis is ready"

            # ── Build application images ────────────────────────────────────
            echo "=== Building app and ws images ==="
            docker compose build \
              --build-arg JWT_SECRET="${JWT_SECRET}" \
              --build-arg OMNIVOTE_ENCRYPTION_KEY="${OMNIVOTE_ENCRYPTION_KEY}" \
              app ws

            # ── Run DB migrations ──────────────────────────────────────────
            echo "=== Running database migrations ==="
            docker compose run --rm app npx prisma migrate deploy

            # ── Start all services ─────────────────────────────────────────
            echo "=== Starting all services ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d

            # ── Wait for app health check ──────────────────────────────────
            echo "=== Waiting for app health check ==="
            timeout 120 bash -c 'until wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q "ok\|up"; do sleep 2; done'
            echo "App is healthy!"

            # ── Cleanup ────────────────────────────────────────────────────
            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo ""
            echo "=== Running containers ==="
            docker compose ps
            echo ""
            echo "=== Deploy complete ==="

      # ── Smoke test ──────────────────────────────────────────────────────
      - name: Smoke test
        if: always()
        run: |
          DEPLOY_URL="${{ secrets.DEPLOY_URL || 'http://${{ secrets.DEPLOY_HOST }}:3000' }}"
          echo "Testing ${DEPLOY_URL}/api/health ..."
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "${DEPLOY_URL}/api/health" || echo "000")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "FAILED: health check returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "PASSED: health check HTTP ${HTTP_CODE}"

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          echo "Deploy ${STATUS^^}: ${SHA} to ${REF}"
