# ──────────────────────────────────────────────────────────────────────────────
# OmniVote — Deploy to Server (Build on Server)
#
# Triggers on push to main (CI runs in parallel).
# git pull on server, builds Docker images, starts all services.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: _BUILD_JWT_SECRET,_BUILD_ENC_KEY
          env: |
            _BUILD_JWT_SECRET: ${{ secrets.JWT_SECRET }}
            _BUILD_ENC_KEY: ${{ secrets.OMNIVOTE_ENCRYPTION_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-/home/apps/OmniVote}"
            DEPLOY_BRANCH="main"

            # ── Clone or pull ────────────────────────────────────────────────
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "=== First deploy: cloning repo ==="
              rm -rf "$DEPLOY_PATH"
              git clone -b "$DEPLOY_BRANCH" https://github.com/olanrewaju111/OmniVote.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              if [ ! -f .env ]; then
                echo "Creating .env from .env.example — EDIT SECRETS ON THE SERVER!"
                cp .env.example .env
              fi
            else
              echo "=== Pulling latest code ==="
              cd "$DEPLOY_PATH"
              git fetch origin "$DEPLOY_BRANCH"
              git reset --hard "origin/$DEPLOY_BRANCH"
            fi

            # ── Start infrastructure ────────────────────────────────────────
            echo "=== Starting infrastructure ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d redis

            echo "=== Waiting for Redis ==="
            timeout 30 bash -c '
              until docker compose exec -T redis redis-cli ping > /dev/null 2>&1; do
                sleep 2
              done
            '
            echo "Redis is ready"

            # ── Build application images (secrets only used as build args) ────
            echo "=== Building app and ws images ==="
            docker compose build \
              --build-arg JWT_SECRET="${_BUILD_JWT_SECRET}" \
              --build-arg OMNIVOTE_ENCRYPTION_KEY="${_BUILD_ENC_KEY}" \
              app ws

            # ── Start all services (runtime vars come from server .env file) ──
            echo "=== Starting all services ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d

            # ── Wait for app health check ──────────────────────────────────
            echo "=== Waiting for app health check ==="
            timeout 120 bash -c 'until wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q "ok\|up"; do sleep 2; done'
            echo "App is healthy!"

            # ── Cleanup ────────────────────────────────────────────────────
            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo ""
            echo "=== Running containers ==="
            docker compose ps
            echo ""
            echo "=== Deploy complete ==="

      # ── Smoke test ──────────────────────────────────────────────────────
      - name: Smoke test
        if: always()
        run: |
          DEPLOY_URL="${{ secrets.DEPLOY_URL || format('http://{0}:3000', secrets.DEPLOY_HOST) }}"
          echo "Testing ${DEPLOY_URL}/api/health ..."
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "${DEPLOY_URL}/api/health" || echo "000")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "FAILED: health check returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "PASSED: health check HTTP ${HTTP_CODE}"

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          echo "Deploy ${STATUS^^}: ${SHA}"
