# OmniVote Prometheus Configuration — Phase 14

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'omnivote-app'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: 'production'
          service: 'omnivote'