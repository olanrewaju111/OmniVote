# OmniVote Prometheus Configuration — Phase 14

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'omnivote-app'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['app:9323']
        labels:
          environment: 'production'
          service: 'omnivote-app'

  - job_name: 'omnivote-ws'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['ws:9324']
        labels:
          environment: 'production'
          service: 'omnivote-ws'